<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#1a0f05"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#f17e01"/>
      <stop offset="1" stop-color="#ff3d6e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#f17e01" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f17e01" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><rect width="1000" height="320" rx="18"/></clipPath>
  </defs>

  <style>
    .spin  { transform-box: fill-box; transform-origin: center; animation: spin 24s linear infinite; }
    .spin2 { transform-box: fill-box; transform-origin: center; animation: spin 38s linear infinite reverse; }
    .spin3 { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite; }
    .wave  { animation: drift 9s ease-in-out infinite alternate; }
    .wave2 { animation: drift 13s ease-in-out infinite alternate-reverse; }
    .dash  { stroke-dasharray: 6 14; animation: flow 3s linear infinite; }
    .dot   { animation: rise 7s ease-in infinite; }
    @keyframes spin  { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { transform: scale(0.85); opacity: .7; } 50% { transform: scale(1.1); opacity: 1; } }
    @keyframes drift { from { transform: translateX(-40px); } to { transform: translateX(40px); } }
    @keyframes flow  { to { stroke-dashoffset: -80; } }
    @keyframes rise  { 0% { transform: translateY(40px); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-340px); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#clip)">
    <rect width="1000" height="320" fill="url(#bg)"/>

    <!-- flowing waves -->
    <g class="wave" opacity="0.5">
      <path d="M-100 220 C 100 160, 250 280, 450 210 S 800 150, 1100 230" fill="none" stroke="url(#fire)" stroke-width="2"/>
      <path d="M-100 240 C 120 190, 280 300, 480 235 S 820 180, 1100 250" fill="none" stroke="url(#fire)" stroke-width="1.2" opacity="0.6"/>
    </g>
    <g class="wave2" opacity="0.35">
      <path d="M-100 100 C 120 40, 300 150, 500 90 S 850 40, 1100 110" fill="none" stroke="#f17e01" stroke-width="1.5"/>
      <path d="M-100 120 C 140 70, 320 170, 520 110 S 870 70, 1100 130" fill="none" stroke="#ff3d6e" stroke-width="1"/>
    </g>

    <!-- core -->
    <circle cx="500" cy="160" r="170" fill="url(#glow)" class="pulse"/>

    <!-- rings -->
    <g class="spin2">
      <circle cx="500" cy="160" r="140" fill="none" stroke="#f17e01" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="2 10"/>
      <circle cx="640" cy="160" r="6" fill="#ff3d6e"/>
    </g>
    <g class="spin">
      <circle cx="500" cy="160" r="105" fill="none" stroke="url(#fire)" stroke-width="2" stroke-dasharray="90 40 20 40"/>
      <circle cx="500" cy="55" r="5" fill="#ffb347"/>
    </g>
    <g class="spin3">
      <circle cx="500" cy="160" r="70" fill="none" stroke="#f17e01" stroke-width="1.5" class="dash"/>
      <rect x="565" y="154" width="12" height="12" fill="#f17e01" transform="rotate(45 571 160)"/>
    </g>

    <!-- hex core -->
    <g class="pulse">
      <polygon points="500,128 528,144 528,176 500,192 472,176 472,144" fill="none" stroke="url(#fire)" stroke-width="2.5"/>
      <polygon points="500,145 514,153 514,167 500,175 486,167 486,153" fill="url(#fire)"/>
    </g>

    <!-- side orbit shapes -->
    <g class="spin" style="animation-duration:30s">
      <rect x="120" y="110" width="90" height="90" rx="10" fill="none" stroke="#f17e01" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
    <g class="spin2" style="animation-duration:22s">
      <rect x="140" y="130" width="50" height="50" rx="6" fill="none" stroke="#ff3d6e" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>
    <g class="spin" style="animation-duration:34s">
      <polygon points="830,105 880,195 780,195" fill="none" stroke="#f17e01" stroke-opacity="0.5" stroke-width="1.5"/>
    </g>
    <g class="spin2" style="animation-duration:18s">
      <polygon points="830,130 858,178 802,178" fill="none" stroke="#ffb347" stroke-opacity="0.6" stroke-width="1.5"/>
    </g>

    <!-- rising particles -->
    <g fill="#f17e01">
      <circle class="dot" cx="80"  cy="300" r="2.5" style="animation-delay:0s"/>
      <circle class="dot" cx="230" cy="310" r="2"   style="animation-delay:1.5s"/>
      <circle class="dot" cx="360" cy="300" r="3"   style="animation-delay:3s"/>
      <circle class="dot" cx="620" cy="310" r="2"   style="animation-delay:.8s"/>
      <circle class="dot" cx="740" cy="300" r="2.5" style="animation-delay:2.4s"/>
      <circle class="dot" cx="900" cy="310" r="3"   style="animation-delay:4s"/>
      <circle class="dot" cx="460" cy="305" r="2"   style="animation-delay:5s" fill="#ff3d6e"/>
      <circle class="dot" cx="960" cy="300" r="2"   style="animation-delay:3.6s" fill="#ff3d6e"/>
    </g>
  </g>
</svg>
